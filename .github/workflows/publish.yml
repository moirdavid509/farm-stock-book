name: Publish app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the app
        run: |
          unzip -q farm-stock-book.zip -d site
          touch site/farm-stock-book/.nojekyll
          cp config.js site/farm-stock-book/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/farm-stock-book
      - id: deployment
        uses: actions/deploy-pages@v4
